version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aegisflow_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegisflow_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/aegisflow
      - DB_NAME=aegisflow
      # Add other environment variables here or load them from .env file
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegisflow_frontend
    ports:
      - "3000:80"  # Expose Nginx on port 3000
    environment:
      - BACKEND_URL=http://localhost:8000 # Default to local mapping, change this to your deployed domain in production (e.g. https://api.yourdomain.com)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
