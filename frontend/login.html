<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisFlow — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;display:flex;min-height:100vh}
.left{flex:0 0 45%;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0e7490 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;position:relative;overflow:hidden}
.left::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,0.15) 0%,transparent 70%);border-radius:50%}
.left::after{content:'';position:absolute;bottom:-100px;left:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,0.15) 0%,transparent 70%);border-radius:50%}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;position:relative;z-index:1}
.brand-icon{width:44px;height:44px;background:linear-gradient(135deg,#06b6d4,#3b82f6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-size:24px;font-weight:700;color:white}
.hero-title{font-size:42px;font-weight:800;color:white;line-height:1.2;margin-bottom:20px;position:relative;z-index:1}
.hero-title span{background:linear-gradient(90deg,#06b6d4,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{color:#94a3b8;font-size:15px;line-height:1.7;margin-bottom:48px;position:relative;z-index:1;max-width:340px}
.shield-graphic{position:relative;z-index:1;margin-bottom:40px}
.shield-graphic svg{filter:drop-shadow(0 20px 40px rgba(6,182,212,0.3))}
.trust-badge{display:flex;align-items:center;gap:8px;color:#64748b;font-size:13px;position:relative;z-index:1}
.trust-badge svg{color:#06b6d4}
.right{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 40px}
.auth-card{background:white;border-radius:20px;padding:48px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.card-title{font-size:26px;font-weight:700;color:#0f172a;margin-bottom:8px}
.card-sub{color:#64748b;font-size:14px;margin-bottom:36px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
.form-input{width:100%;padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#0f172a;transition:all 0.2s;outline:none;background:#fafafa}
.form-input:focus{border-color:#06b6d4;background:white;box-shadow:0 0 0 3px rgba(6,182,212,0.1)}
.input-wrap{position:relative}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;display:flex;align-items:center}
.eye-btn:hover{color:#06b6d4}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;cursor:pointer}
.checkbox-label input{accent-color:#06b6d4;width:15px;height:15px}
.forgot-link{font-size:13px;color:#ef4444;text-decoration:none;font-weight:500}
.forgot-link:hover{text-decoration:underline}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#06b6d4 0%,#f97316 100%);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-bottom:20px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(6,182,212,0.35)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.divider{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.signup-link{text-align:center;font-size:14px;color:#64748b}
.signup-link a{color:#06b6d4;font-weight:600;text-decoration:none}
.signup-link a:hover{text-decoration:underline}
.msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.msg.error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.msg.info{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LEFT HERO -->
<div class="left">
  <div class="brand">
    <div class="brand-icon">🛡️</div>
    <span class="brand-name">AegisFlow</span>
  </div>
  <div class="shield-graphic">
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none">
      <path d="M80 10L140 35V80C140 112 80 150 80 150C80 150 20 112 20 80V35L80 10Z" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="2"/>
      <path d="M80 30L120 50V80C120 102 80 125 80 125C80 125 40 102 40 80V50L80 30Z" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
      <circle cx="80" cy="80" r="22" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="2"/>
      <path d="M68 80L76 88L92 72" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="hero-title">Secure. Smart.<br><span>Self-Healing.</span></h1>
  <p class="hero-desc">A modern DevSecOps platform that scans, analyzes and helps you ship secure code faster with AI-powered vulnerability detection.</p>
  <div class="trust-badge">
    <svg width="14" height="14" fill="none" stroke="#06b6d4" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Trusted by developers worldwide
  </div>
</div>

<!-- RIGHT FORM -->
<div class="right">
  <div class="auth-card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your account</p>

    <div id="msg" class="msg"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <input class="form-input" type="text" id="username" placeholder="you@example.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••••" required autocomplete="current-password" style="padding-right:42px">
          <button type="button" class="eye-btn" onclick="togglePwd('password',this)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    </form>

    <div class="divider">Don't have an account? <a href="register.html" style="color:#06b6d4;font-weight:600;text-decoration:none">Sign Up</a></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = `msg ${type}`;
  el.style.display = 'block';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    inp.type = 'password';
    btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';

  try {
    const payload = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
      rememberMe: document.getElementById('rememberMe').checked
    };

    console.log('Login attempt:', payload.username);

    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    console.log('Login response:', res.status, data);

    if (res.ok && data.access_token) {
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user_profile', JSON.stringify(data.user));
      showMsg('✓ Login successful! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } else {
      showMsg('✗ ' + (data.detail || 'Invalid credentials'), 'error');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  } catch (err) {
    console.error('Login error:', err);
    showMsg('✗ Cannot connect to server on port 8000. Is backend running?', 'error');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

// Redirect if already logged in
if (localStorage.getItem('access_token')) {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
