<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<title>AegisFlow — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; flex-direction: row; overflow-x: hidden;}
@media(max-width: 900px) { body { flex-direction: column; } .left, .right { padding: 40px 20px; flex: auto; width: 100%; } }
.left { flex: 0 0 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; position: relative; z-index: 10; }


.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;position:relative;z-index:1}
.brand-icon{width:44px;height:44px;background:linear-gradient(135deg,#06b6d4,#3b82f6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-size:24px;font-weight:700;color:white}
.hero-title{font-size:42px;font-weight:800;color:white;line-height:1.2;margin-bottom:20px;position:relative;z-index:1}
.hero-title span{background:linear-gradient(90deg,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{color:var(--text-muted);font-size:15px;line-height:1.7;margin-bottom:48px;position:relative;z-index:1;max-width:340px}
.shield-graphic{position:relative;z-index:1;margin-bottom:40px}
.shield-graphic svg{filter:drop-shadow(0 20px 40px rgba(6,182,212,0.3))}
.trust-badge{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:13px;position:relative;z-index:1}
.trust-badge svg{color:#ec4899}
.right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 40px; z-index: 10; position: relative; }
.auth-card{background:white;border-radius:20px;padding:48px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.card-title{font-size:26px;font-weight:700;color:#0f172a;margin-bottom:8px}
.card-sub{color:var(--text-muted);font-size:14px;margin-bottom:36px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
.form-input{width:100%;padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#0f172a;transition:all 0.2s;outline:none;background:#fafafa}
.form-input:focus{border-color:#ec4899;background:white;box-shadow:0 0 0 3px rgba(6,182,212,0.1)}
.input-wrap{position:relative}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center}
.eye-btn:hover{color:#ec4899}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer}
.checkbox-label input{accent-color:#ec4899;width:15px;height:15px}
.forgot-link{font-size:13px;color:#ef4444;text-decoration:none;font-weight:500}
.forgot-link:hover{text-decoration:underline}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#06b6d4 0%,#f97316 100%);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-bottom:20px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(6,182,212,0.35)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.divider{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:20px}
.signup-link{text-align:center;font-size:14px;color:var(--text-muted)}
.signup-link a{color:#ec4899;font-weight:600;text-decoration:none}
.signup-link a:hover{text-decoration:underline}
.msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.msg.error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.msg.info{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==============================================================
   PREMIUM GLASSMORPHIC THEME OVERRIDES
   ============================================================== */
:root {
  --bg: #09090b;
  --surface: rgba(24, 24, 27, 0.4);
  --surface-border: rgba(255, 255, 255, 0.08);
  --surface-hover: rgba(255, 255, 255, 0.05);
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  --text-secondary: #e4e4e7;
  --accent-primary: #8b5cf6;
  --accent-secondary: #ec4899;
  --accent-tertiary: #3b82f6;
  --glow-op: 0.15;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: rgba(255, 255, 255, 0.8);
  --surface-border: rgba(0, 0, 0, 0.05);
  --surface-hover: rgba(0, 0, 0, 0.02);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-secondary: #334155;
  --glow-op: 0.1;
}

body{font-family: 'Inter', sans-serif;}

/* Ambient Glows */
.ambient-glow {
  position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1;
  opacity: var(--glow-op); transition: opacity 0.4s ease; pointer-events: none;
}
.glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent-tertiary); }
.glow-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: var(--accent-primary); }
.glow-3 { top: 30%; left: 40%; width: 40vw; height: 40vw; background: var(--accent-secondary); }

/* Overrides for index.html elements */
.sidebar, .topbar, .card, .stat-card, .toast, .notif-dropdown, .auth-card, .table-container, .code-editor-head {
  background: var(--surface) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border-color: var(--surface-border) !important;
  color: var(--text-main) !important;
}

.card-head, .topbar, .sidebar-brand, .sidebar-user, .auth-card { border-color: var(--surface-border) !important; }
.topbar-left h1, .brand-name, .card-title, .user-name, .stat-value, .upload-title, .vuln-title, .info-value, .notif-head, .hero-title, .auth-card h1 { color: var(--text-main) !important; }
.topbar-left p, .nav-item, .card-sub, .upload-sub, .vuln-desc, .text-muted, .empty-title, .empty-sub, .stat-label, .profile-role, .profile-stat-label, .hero-desc, .auth-card p { color: var(--text-muted) !important; }

.nav-item:hover, .user-card:hover, .settings-item:hover, .history-table tr:hover td { background: var(--surface-hover) !important; }

/* Remove old dark mode classes to avoid conflicts */
body.dark-mode { background-color: var(--bg) !important; color: var(--text-main) !important; }

/* Buttons */
.btn-primary, .btn-teal, .btn-coral, .btn-green {
  border-radius: 9999px !important;
  border: none !important;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)) !important;
  color: white !important;
}
.btn-primary:hover, .btn-teal:hover, .btn-coral:hover, .btn-green:hover {
  background: linear-gradient(135deg, #7c3aed, #db2777) !important;
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4) !important;
}

/* Text Inputs */
.search-box, .edit-input, select, .form-input {
  background: rgba(255, 255, 255, 0.03) !important;
  border-color: var(--surface-border) !important;
  color: var(--text-main) !important;
  backdrop-filter: blur(10px);
}
.search-box input, .form-input { color: var(--text-main) !important; }

/* History Table overrides */
.history-table th { background: rgba(0,0,0,0.05) !important; border-color: var(--surface-border) !important; color: var(--text-muted) !important; }
.history-table td { border-color: var(--surface-border) !important; color: var(--text-secondary) !important; }

/* Left Auth Section */
.left { flex: 0 0 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; position: relative; z-index: 10; }

</style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- Theme Toggle -->
  <button id="themeToggle" onclick="toggleTheme()" style="position: absolute; top: 20px; right: 20px; z-index: 100; border: 1px solid var(--surface-border); background: var(--surface); padding: 8px 12px; border-radius: 9999px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; backdrop-filter: blur(10px);">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg> Light Mode
  </button>

  <!-- Ambient Background -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>


<!-- LEFT HERO -->
<div class="left">
  <div class="brand" style="justify-content: center; width: 100%; margin-bottom: 30px;">
    <img src="logo.png" alt="AegisFlow Logo" style="height: 280px">
  </div>
  <h1 class="hero-title">Secure. Smart.<br><span>Self-Healing.</span></h1>
  <p class="hero-desc">A modern DevSecOps platform that scans, analyzes and helps you ship secure code faster with AI-powered vulnerability detection.</p>
  <div class="trust-badge">
    <svg width="14" height="14" fill="none" stroke="#ec4899" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Trusted by developers worldwide
  </div>
</div>

<!-- RIGHT FORM -->
<div class="right">
  <div class="auth-card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your account</p>

    <div id="msg" class="msg"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <input class="form-input" type="text" id="username" placeholder="you@example.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••••" required autocomplete="current-password" style="padding-right:42px">
          <button type="button" class="eye-btn" onclick="togglePwd('password',this)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    </form>

    <div class="divider">Don't have an account? <a href="register.html" style="color:#ec4899;font-weight:600;text-decoration:none">Sign Up</a></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = `msg ${type}`;
  el.style.display = 'block';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    inp.type = 'password';
    btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';

  try {
    const payload = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
      rememberMe: document.getElementById('rememberMe').checked
    };

    console.log('Login attempt:', payload.username);

    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    console.log('Login response:', res.status, data);

    if (res.ok && data.access_token) {
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user_profile', JSON.stringify(data.user));
      showMsg('✓ Login successful! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } else {
      showMsg('✗ ' + (data.detail || 'Invalid credentials'), 'error');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  } catch (err) {
    console.error('Login error:', err);
    showMsg('✗ Cannot connect to server on port 8000. Is backend running?', 'error');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

// Redirect if already logged in
if (localStorage.getItem('access_token')) {
  window.location.href = 'index.html';
}
</script>
<script>

    // Theme Toggling Logic
    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('themeToggle');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        if(btn) btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg> Dark Mode';
        localStorage.setItem('aegisflow-theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        if(btn) btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg> Light Mode';
        localStorage.setItem('aegisflow-theme', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('aegisflow-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('themeToggle');
        if(btn) {
           btn.innerHTML = savedTheme === 'light' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg> Dark Mode' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg> Light Mode';
        }
    });

</script>
</body>
</html>
